; Limites de upload — os CSVs grandes chegam como JSON no corpo da requisição.
; .user.ini é lido pelo PHP-FPM/CGI sem risco de 500 (ao contrário de .htaccess
; com php_value quando AllowOverride está desligado). Se o host usar mod_php,
; replicar estes valores no php.ini ou num <Directory> da config do Apache.
post_max_size = 20M
upload_max_filesize = 20M
memory_limit = 256M
max_execution_time = 120
